services:
  # ====================================================
  # BASE CONTROL PLANE (Mandatory)
  # ====================================================
  postgres:
    image: postgres:15-alpine
    container_name: driftguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-driftguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftguard}
      POSTGRES_DB: ${POSTGRES_DB:-driftguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driftguard} -d ${POSTGRES_DB:-driftguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: driftguard-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  driftguard-api:
    image: yugenjr/driftguard-api:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - REQUIREMENTS_FILE=requirements/prod.txt
    container_name: driftguard-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-driftguard}
      POSTGRES_USER: ${POSTGRES_USER:-driftguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftguard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      PREFECT_API_URL: ${PREFECT_API_URL:-}
      DRIFTGUARD_EVIDENTLY_URL: ${DRIFTGUARD_EVIDENTLY_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  driftguard-dashboard:
    image: yugenjr/driftguard-dashboard:0.1.0
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: driftguard-dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      DRIFTGUARD_API_URL: ${DRIFTGUARD_API_URL:-http://driftguard-api:8000}
    depends_on:
      driftguard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ====================================================
  # OBSERVABILITY (Optional)
  # ====================================================
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.45.0
    container_name: driftguard-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.0.0
    container_name: driftguard-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # ====================================================
  # MESSAGING / EVENTING (Optional)
  # ====================================================
  zookeeper:
    profiles: ["messaging"]
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: driftguard-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    profiles: ["messaging"]
    image: confluentinc/cp-kafka:7.4.0
    container_name: driftguard-kafka
    restart: always
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================
  # ORCHESTRATION & ML LIFECYCLE (Optional)
  # ====================================================
  mlflow:
    profiles: ["mlflow"]
    image: yugenjr/driftguard-mlflow:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - REQUIREMENTS_FILE=requirements/prod.txt
    container_name: driftguard-mlflow
    restart: always
    command: mlflow server --backend-store-uri postgresql://${POSTGRES_USER:-driftguard}:${POSTGRES_PASSWORD:-driftguard}@postgres:5432/${POSTGRES_DB:-driftguard} --default-artifact-root ${MLFLOW_ARTIFACT_ROOT:-s3://driftguard-prod-artifacts-yugen/mlflow} --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  prefect:
    profiles: ["orchestration"]
    image: yugenjr/driftguard-prefect:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - REQUIREMENTS_FILE=requirements/pipeline.txt
        - PYTHON_VERSION=3.10
    container_name: driftguard-prefect
    restart: always
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-driftguard}:${POSTGRES_PASSWORD:-driftguard}@postgres:5432/prefect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  driftguard-evidently:
    profiles: ["evidently"]
    image: yugenjr/driftguard-evidently:0.1.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - REQUIREMENTS_FILE=requirements/evidently.txt
    container_name: driftguard-evidently
    restart: always
    command: ["uvicorn", "monitoring.evidently_app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    environment:
      - SERVICE_MODE=evidently
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
